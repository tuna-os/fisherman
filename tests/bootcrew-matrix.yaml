# Bootcrew CI regression test matrix.
# Used by bootcrew-fast.yml (PR gate, disk-ops), bootcrew-vm.yml (PR gate, VM boot),
# and bootcrew-nightly.yml (full install).
# Add new images here; all workflows pick them up automatically.
# 
# vm_boot: true — include in bootcrew-vm.yml for E2E VM boot tests on every PR
#          false (default) — skip in VM boot tests (reserved for nightly + disk-ops)
images:
  - name: dakota
    image: ghcr.io/projectbluefin/dakota:latest
    filesystem: xfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # PRIMARY PRODUCTION IMAGE - critical to test on every PR

  - name: bluefin-lts
    image: ghcr.io/ublue-os/bluefin:lts
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  - name: centos-bootc
    image: quay.io/centos-bootc/centos-bootc:c10s
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # ostree backend verification

  - name: yellowfin-gnome50
    image: ghcr.io/tuna-os/yellowfin:gnome50
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: true
    flatpaks:
      - org.mozilla.firefox
    vm_boot: false

  - name: ubuntu-bootc
    image: ghcr.io/bootcrew/ubuntu-bootc:latest
    filesystem: xfs
    composefs_backend: true
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false  # TODO: bootcrew image broken, find or create working ubuntu-bootc image

  # gnomeos-bootc disabled: consistently fails with missing blob in containers-storage
  # (sha256:6d2d10...) — likely a broken layer in the ghcr.io/bootcrew/gnomeos-bootc image.
  # Re-enable once upstream fixes the image.
  # - name: gnomeos-bootc
  #   image: ghcr.io/bootcrew/gnomeos-bootc:latest
  #   filesystem: xfs
  #   composefs_backend: true
  #   unified_storage: false
  #   selinux_disabled: false

  - name: opensuse-bootc
    image: ghcr.io/bootcrew/opensuse-bootc:latest
    filesystem: xfs
    composefs_backend: true
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  - name: arch-bootc
    image: ghcr.io/bootcrew/arch-bootc:latest
    filesystem: xfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # composefs backend verification

  # LUKS variants — vm_boot only (nightly excluded: nightly patches root=/dev/vdaX which is wrong for LUKS)
  - name: dakota-luks
    image: ghcr.io/projectbluefin/dakota:latest
    ssh_image_name: dakota
    filesystem: xfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  - name: arch-bootc-luks-xfs
    image: ghcr.io/bootcrew/arch-bootc:latest
    ssh_image_name: arch-bootc
    filesystem: xfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # gentoo-bootc disabled: consistently fails with missing blob in containers-storage
  # (sha256:2443e8...) — likely a broken layer in the ghcr.io/bootcrew/gentoo-bootc image.
  # Re-enable once upstream fixes the image.
  # - name: gentoo-bootc
  #   image: ghcr.io/bootcrew/gentoo-bootc:latest
  #   filesystem: xfs
  #   composefs_backend: true
  #   unified_storage: false
  #   selinux_disabled: false

  - name: debian-bootc
    image: ghcr.io/bootcrew/debian-bootc:latest
    filesystem: xfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # composefs backend verification (using pre-built SSH image)

  - name: frostyard-snow
    image: ghcr.io/frostyard/snow:latest
    filesystem: btrfs
    composefs_backend: true
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  # frostyard-snowloaded disabled: image bundles an older libostree built without
  # composefs support, but the Ubuntu 24.04 runner has the composefs kernel module
  # loaded. libostree sees composefs available at runtime and tries to use it, then
  # fails with "composefs: enabled at runtime, but support is not compiled in".
  # Re-enable once the image ships a libostree with composefs compiled in.
  # - name: frostyard-snowloaded
  #   image: ghcr.io/frostyard/snowloaded:latest
  #   filesystem: xfs
  #   composefs_backend: false
  #   unified_storage: false
  #   selinux_disabled: false
