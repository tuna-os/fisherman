# Bootcrew CI regression test matrix.
# Used by bootcrew-fast.yml (PR gate, disk-ops), bootcrew-vm.yml (PR gate, VM boot),
# and bootcrew-nightly.yml (full install).
# Add new images here; all workflows pick them up automatically.
# 
# vm_boot: true — include in bootcrew-vm.yml for E2E VM boot tests on every PR
#          false (default) — skip in VM boot tests (reserved for nightly + disk-ops)
# required: true — failure of this image fails the workflow (use for canary
#          images that exercise each install backend). Required canaries:
#          - dakota:        composefs-backend + systemd-boot
#          - centos-bootc:  ostree-backend + grub2
#          Other vm_boot images run advisory: their failures show up in the
#          job summary but do not fail the workflow. Frees us from chasing
#          per-image flakes while still keeping signal on the backends that
#          matter.
images:
  - name: dakota
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # PRIMARY PRODUCTION IMAGE - critical to test on every PR
    required: true # composefs + systemd-boot canary
    build_ssh_image: true

  - name: bluefin-lts
    image: ghcr.io/ublue-os/bluefin@sha256:c4fe04748470e801f9ec44c2c9931d5447957211567144d7bef37eae47514585 # lts
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  - name: centos-bootc
    image: quay.io/centos-bootc/centos-bootc@sha256:9aedf2d189b85c498697f9b83112c893b084d359268da7dd6d5d848478d260de # c10s
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # ostree backend verification
    required: true # ostree + grub2 canary
    build_ssh_image: true

  - name: yellowfin-gnome50
    image: ghcr.io/tuna-os/yellowfin@sha256:c4d3a42f6defa62c4c28b86b09eeb08748b78922d6df26fc5f3107dbcbd9d1c0 # gnome50
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: true
    flatpaks:
      - org.mozilla.firefox
    vm_boot: true   # exercises Flatpak-copy + installer-app-exclusion (PR #1)
    build_ssh_image: true

  # Issue #176: constrain the installer itself, not only the post-install
  # QEMU guest. yellowfin is a large desktop image and exercises the
  # non-composefs podman path where VFS copies previously caused OOM kills.
  # The just recipe forces podman into the same cgroup so child containers
  # cannot escape the 4 GiB limit.
  - name: yellowfin-gnome50-low-memory
    image: ghcr.io/tuna-os/yellowfin@sha256:c4d3a42f6defa62c4c28b86b09eeb08748b78922d6df26fc5f3107dbcbd9d1c0 # gnome50
    ssh_image_name: yellowfin-gnome50
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: true
    flatpaks:
      - org.mozilla.firefox
    install_memory_max: 4G
    nightly: false
    vm_boot: true

  # composefs_backend must stay false while filesystem is xfs: the recipe
  # validator rejects the pair outright ("composefs-backend requires
  # fs-verity, which XFS does not support"), so the install never starts.
  # #97 dropped the same combo from arch-bootc/arch-bootc-luks-xfs/debian-bootc
  # but did not reach here, because vm_boot: false keeps these two out of the
  # PR gate — nightly still processes every entry regardless of vm_boot (#106).
  - name: ubuntu-bootc
    image: ghcr.io/bootcrew/ubuntu-bootc@sha256:296b8d2367db7026d90db281b868837e275a2cff116e3f6ab401cd3f40e6562d # latest
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false  # TODO: bootcrew image broken, find or create working ubuntu-bootc image

  # gnomeos-bootc disabled: consistently fails with missing blob in containers-storage
  # (sha256:6d2d10...) — likely a broken layer in the ghcr.io/bootcrew/gnomeos-bootc image.
  # Re-enable once upstream fixes the image.
  # - name: gnomeos-bootc
  #   image: ghcr.io/bootcrew/gnomeos-bootc:latest
  #   filesystem: xfs
  #   composefs_backend: true
  #   unified_storage: false
  #   selinux_disabled: false

  # composefs_backend false for the same reason as ubuntu-bootc above.
  - name: opensuse-bootc
    image: ghcr.io/bootcrew/opensuse-bootc@sha256:c9f8126d87d805bb150046278ed68f3e20ff881602fb4579e4876f13c59183b3 # latest
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  # ghcr.io/bootcrew/arch-bootc is a composefs-native image and ships no
  # `ostree` binary, so it can only be installed via --composefs-backend.
  # composefs requires fs-verity, which XFS does not support, so use ext4
  # (the same backend/layout as the passing dakota canary).
  - name: arch-bootc
    image: ghcr.io/bootcrew/arch-bootc@sha256:14b31e6578955ea4facbb51024e77f1e19080256f4abf0132820a0241c953d71 # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # composefs backend verification
    build_ssh_image: true

  # LUKS variants — vm_boot only (nightly excluded: nightly patches root=/dev/vdaX which is wrong for LUKS)
  - name: dakota-luks
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # Same composefs-native arch-bootc image as above, now under LUKS. XFS
  # cannot be used with composefs-backend (no fs-verity), so filesystem is
  # ext4 — the same LUKS+composefs+ext4 layout as the passing dakota-luks.
  - name: arch-bootc-luks
    image: ghcr.io/bootcrew/arch-bootc@sha256:14b31e6578955ea4facbb51024e77f1e19080256f4abf0132820a0241c953d71 # latest
    ssh_image_name: arch-bootc
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # Regression test for issue #38: composefs + btrfs + LUKS.
  # The original bug occurred when scratch was on btrfs (live-ISO path, space-constrained /var).
  # This entry tests btrfs+LUKS+composefs in CI (scratch is /var/fisherman-tmp on the runner, not
  # btrfs, so does not reproduce the exact scratch-on-btrfs failure mode — but validates the
  # LUKS+composefs install path against a btrfs target filesystem end-to-end).
  - name: dakota-luks-btrfs
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: btrfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # gentoo-bootc disabled: consistently fails with missing blob in containers-storage
  # (sha256:2443e8...) — likely a broken layer in the ghcr.io/bootcrew/gentoo-bootc image.
  # Re-enable once upstream fixes the image.
  # - name: gentoo-bootc
  #   image: ghcr.io/bootcrew/gentoo-bootc:latest
  #   filesystem: xfs
  #   composefs_backend: true
  #   unified_storage: false
  #   selinux_disabled: false

  # ghcr.io/bootcrew/debian-bootc is a composefs-native image and ships no
  # `ostree` binary: with composefs_backend=false the ostree install path
  # fails with "Creating ostree deployment: No such file or directory".
  # composefs requires fs-verity, which XFS does not support, so use ext4
  # (the same backend/layout as the passing dakota canary).
  - name: debian-bootc
    image: ghcr.io/bootcrew/debian-bootc@sha256:006eaaad4072b4925ef6f2bb693332a81baee1ff01fec4b1a68bdcc7b0eb622b # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false  # SSH-enabled image boots but never answers SSH in the VM (login prompt only); keep nightly-only until ssh.service is fixed
    build_ssh_image: true

  - name: frostyard-snow
    image: ghcr.io/frostyard/snow@sha256:7c1a655c3754f758bb39ad32ed0de3fa1ff70db346dc9e9e78bc4cc9beef6eee # latest
    filesystem: btrfs
    composefs_backend: true
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  # frostyard-snowloaded disabled: image bundles an older libostree built without
  # composefs support, but the Ubuntu 24.04 runner has the composefs kernel module
  # loaded. libostree sees composefs available at runtime and tries to use it, then
  # fails with "composefs: enabled at runtime, but support is not compiled in".
  # Re-enable once the image ships a libostree with composefs compiled in.
  # - name: frostyard-snowloaded
  #   image: ghcr.io/frostyard/snowloaded:latest
  #   filesystem: xfs
  #   composefs_backend: false
  #   unified_storage: false
  #   selinux_disabled: false
