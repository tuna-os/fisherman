# Bootcrew CI regression test matrix.
# Used by bootcrew-fast.yml (PR gate, disk-ops), bootcrew-vm.yml (PR gate, VM boot),
# and bootcrew-nightly.yml (full install).
# Add new images here; all workflows pick them up automatically.
# 
# vm_boot: true — include in bootcrew-vm.yml for E2E VM boot tests on every PR
#          false (default) — skip in VM boot tests (reserved for nightly + disk-ops)
# required: true — failure of this image fails the workflow (use for canary
#          images that exercise each install backend). Required canaries:
#          - dakota:        composefs-backend + systemd-boot
#          - centos-bootc:  ostree-backend + grub2
#          - centos-bootc-luks-user, centos-bootc-var-disk, dakota-tpm2:
#            the #418 shapes (LUKS + user, varDisk, swtpm), gating (#423)
#          bootcrew-vm.yml also runs every night on dev, so the required
#          entries gate the nightly as well as each PR.
#          Other vm_boot images run advisory: their failures show up in the
#          job summary but do not fail the workflow. Frees us from chasing
#          per-image flakes while still keeping signal on the backends that
#          matter.
# bootloader: systemd | grub2 (default) — passed to fisherman by every harness,
#          and it selects the partition layout the nightly asserts
#          (systemd: EFI + DPS-typed root; grub2: EFI + ext4 /boot + root).
# Optional recipe parts (scripts/matrix-recipe.py turns an entry into the
# recipe; bootcrew-vm.yml only — the nightly writes its own recipe and knows
# none of them, so such entries set nightly: false):
#   luks: true + luks_passphrase — encryption luks-passphrase
#   encryption: tpm2-luks-passphrase (with luks_passphrase) — the VM gets a
#          swtpm; the first boot unlocks with the passphrase and enrolls,
#          the second boot types nothing (scripts/vm-checks/tpm2-enrolled.sh)
#   encryption: tpm2-luks (no passphrase) — the same two boots; the first
#          one types the recovery key, which the harness takes from the
#          install's recovery_key event (scripts/capture-recovery-key.py).
#          The second boot of either tpm2 type must show no passphrase
#          prompt (scripts/vm-checks/no-passphrase-prompt.sh)
#   user: true — a `user` block (bootcrew, in wheel); the user must sign in
#          and have the recipe's password (scripts/vm-checks/user.sh)
#   var_disk: true — a second disk as `varDisk`; /var must be it on the
#          booted system (scripts/vm-checks/var-disk.sh)
#   btrfs_subvolumes: true — "btrfsSubvolumes": true; the booted system
#          must mount the @ subvolume as the recipe says
#          (scripts/vm-checks/btrfs-subvolumes.sh)
#   enabled_units: true — the booted system enables no unit the image did
#          not enable, except fisherman's own and the harness's ssh
#          (scripts/vm-checks/enabled-units.sh has the allowlist). ostree
#          entries only: the image's /etc is read from /usr/etc.
#   tests/check-validation.sh runs every entry's recipe through
#   `fisherman validate --json --partial`.
# nightly_advisory: true — bootcrew-nightly.yml still runs the full install
#          and boot for this image, but a failure does not fail the workflow.
#          Only for images whose upstream is shown to be broken; the entry's
#          comment must carry that evidence and say what clears it.
images:
  - name: dakota
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # PRIMARY PRODUCTION IMAGE - critical to test on every PR
    required: true # composefs + systemd-boot canary
    build_ssh_image: true

  # bluefin-lts removed: Bluefin LTS is discontinued and its pinned digest is
  # gone upstream ("manifest unknown" in nightly run 40098003911).

  - name: centos-bootc
    image: quay.io/centos-bootc/centos-bootc@sha256:9aedf2d189b85c498697f9b83112c893b084d359268da7dd6d5d848478d260de # c10s
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # ostree backend verification
    required: true # ostree + grub2 canary
    build_ssh_image: true
    # #422: the booted system enables no unit the image did not enable
    # (scripts/vm-checks/enabled-units.sh). It passed as an advisory entry
    # on a booted guest before it moved here.
    enabled_units: true

  - name: yellowfin-gnome50
    image: ghcr.io/tuna-os/yellowfin@sha256:c4d3a42f6defa62c4c28b86b09eeb08748b78922d6df26fc5f3107dbcbd9d1c0 # gnome50
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: true
    flatpaks:
      - org.mozilla.firefox
    vm_boot: true   # exercises Flatpak-copy + installer-app-exclusion (PR #1)
    build_ssh_image: true

  # Issue #176: constrain the installer itself, not only the post-install
  # QEMU guest. yellowfin is a large desktop image and exercises the
  # non-composefs podman path where VFS copies previously caused OOM kills.
  # The just recipe forces podman into the same cgroup so child containers
  # cannot escape the 4 GiB limit.
  - name: yellowfin-gnome50-low-memory
    image: ghcr.io/tuna-os/yellowfin@sha256:c4d3a42f6defa62c4c28b86b09eeb08748b78922d6df26fc5f3107dbcbd9d1c0 # gnome50
    ssh_image_name: yellowfin-gnome50
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: true
    flatpaks:
      - org.mozilla.firefox
    install_memory_max: 4G
    nightly: false
    vm_boot: true

  # ghcr.io/bootcrew/ubuntu-bootc is composefs-native, exactly like
  # debian-bootc below: the pinned digest ships bootc 1.16.10 and no `ostree`
  # (or podman) binary, so the ostree path it was configured for died in
  # every nightly with "Creating ostree deployment: No such file or directory
  # (os error 2)" — the same error debian-bootc hit before it moved to the
  # composefs backend. Same fix here: composefs backend + systemd-boot, on
  # ext4 because composefs needs fs-verity and XFS has none.
  - name: ubuntu-bootc
    image: ghcr.io/bootcrew/ubuntu-bootc@sha256:296b8d2367db7026d90db281b868837e275a2cff116e3f6ab401cd3f40e6562d # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false  # no ssh-enabled image is built for it; nightly covers install + boot

  # gnomeos-bootc disabled: consistently fails with missing blob in containers-storage
  # (sha256:6d2d10...) — likely a broken layer in the ghcr.io/bootcrew/gnomeos-bootc image.
  # Re-enable once upstream fixes the image.
  # - name: gnomeos-bootc
  #   image: ghcr.io/bootcrew/gnomeos-bootc:latest
  #   filesystem: xfs
  #   composefs_backend: true
  #   unified_storage: false
  #   selinux_disabled: false

  # ADVISORY in nightly: the upstream image cannot install itself.
  # bootc 1.17.1 in this image creates the bound-image store with podman
  # during `bootc install to-filesystem`, and the image does not ship podman:
  #   error: Installing to filesystem: Creating imgstorage: podman executable
  #   not found in PATH; it is required for container image storage operations
  # The last four nightlies (2026-09-21 .. 2026-10-12, runs 35573901848,
  # 36396130996, 37283228750, 38224754894) failed that way on four different
  # upstream digests; it reproduces with the image's own bootc on the pinned
  # digest outside fisherman; and ghcr.io/bootcrew/opensuse-bootc
  # :latest as of 2026-10-24 (sha256:3ee6bfa1...) still has /usr/bin/bootc
  # and /usr/bin/ostree but no /usr/bin/podman. Nothing fisherman passes can
  # supply a binary missing from the image bootc runs in. Drop
  # nightly_advisory once a digest ships podman (or a bootc that no longer
  # needs it) and passes.
  - name: opensuse-bootc
    image: ghcr.io/bootcrew/opensuse-bootc@sha256:c9f8126d87d805bb150046278ed68f3e20ff881602fb4579e4876f13c59183b3 # latest
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false
    nightly_advisory: true

  # ghcr.io/bootcrew/arch-bootc is a composefs-native image and ships no
  # `ostree` binary, so it can only be installed via --composefs-backend.
  # composefs requires fs-verity, which XFS does not support, so use ext4
  # (the same backend/layout as the passing dakota canary).
  - name: arch-bootc
    image: ghcr.io/bootcrew/arch-bootc@sha256:14b31e6578955ea4facbb51024e77f1e19080256f4abf0132820a0241c953d71 # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: true  # composefs backend verification
    build_ssh_image: true

  # LUKS variants — vm_boot only (nightly excluded: nightly patches root=/dev/vdaX which is wrong for LUKS)
  - name: dakota-luks
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # Same composefs-native arch-bootc image as above, now under LUKS. XFS
  # cannot be used with composefs-backend (no fs-verity), so filesystem is
  # ext4 — the same LUKS+composefs+ext4 layout as the passing dakota-luks.
  - name: arch-bootc-luks
    image: ghcr.io/bootcrew/arch-bootc@sha256:14b31e6578955ea4facbb51024e77f1e19080256f4abf0132820a0241c953d71 # latest
    ssh_image_name: arch-bootc
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # Regression test for issue #38: composefs + btrfs + LUKS.
  # The original bug occurred when scratch was on btrfs (live-ISO path, space-constrained /var).
  # This entry tests btrfs+LUKS+composefs in CI (scratch is /var/fisherman-tmp on the runner, not
  # btrfs, so does not reproduce the exact scratch-on-btrfs failure mode — but validates the
  # LUKS+composefs install path against a btrfs target filesystem end-to-end).
  - name: dakota-luks-btrfs
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: btrfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # ── #418: paths no entry covered. PR gate and nightly VM run only
  # (nightly: false keeps them out of bootcrew-nightly.yml, which writes its
  # own recipe). centos-bootc-luks-user, centos-bootc-var-disk and
  # dakota-tpm2 are `required` (#423); dakota-tpm2-luks stays advisory.
  #
  # Not covered, and why:
  # - ZFS: no image here ships the ZFS kernel module, and ZFS stays
  #   experimental until one does (#413).
  # - A manual layout (customMounts): the harness has no step that
  #   partitions the disk before fisherman runs; custom-mounts-e2e.yml runs
  #   the loopback unit test only.
  # - arm64 boot: every digest here is x86_64, and the harness has no arm64
  #   firmware (AAVMF) or arm64 ssh-enabled images. bootcrew-vm.yml builds
  #   and unit-tests fisherman on arm64 instead (arm64 unit tests, gating).
  # - tpm2-luks without a passphrase used to be here: its first boot needs
  #   the recovery key, which only the install's recovery_key event carries.
  #   The harness now captures it (dakota-tpm2-luks below).

  # The most common desktop shape: GRUB, ostree, XFS, LUKS and a user. Must
  # boot, unlock with the passphrase, and let the user sign in.
  - name: centos-bootc-luks-user
    image: quay.io/centos-bootc/centos-bootc@sha256:9aedf2d189b85c498697f9b83112c893b084d359268da7dd6d5d848478d260de # c10s
    ssh_image_name: centos-bootc
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    luks: true
    luks_passphrase: "bootcrew-luks-test"
    user: true
    vm_timeout: 800
    nightly: false
    vm_boot: true
    required: true # #423: gating, on each PR and the nightly VM run

  # A separate /var disk. ostree and unencrypted: fisherman refuses a
  # varDisk on composefs (#252) and with LUKS (#406).
  - name: centos-bootc-var-disk
    image: quay.io/centos-bootc/centos-bootc@sha256:9aedf2d189b85c498697f9b83112c893b084d359268da7dd6d5d848478d260de # c10s
    ssh_image_name: centos-bootc
    filesystem: xfs
    composefs_backend: false
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    var_disk: true
    nightly: false
    vm_boot: true
    required: true # #423: gating, on each PR and the nightly VM run

  # tpm2-luks (#418 item 2, #421): TPM2 with no passphrase. fisherman makes
  # a random key and emits it once as the recovery_key event; the harness
  # captures it from the install's output (redacted in the log, masked on
  # GitHub, kept in a 0600 file under /tmp only until it is read). The
  # first boot has no TPM2 token yet: luks-unlock.py types the recovery
  # key, and the first-boot unit enrolls the swtpm with its single-use key.
  # The second boot types nothing and must show no passphrase prompt
  # (the same two boots as dakota-tpm2 below).
  - name: dakota-tpm2-luks
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    encryption: tpm2-luks
    vm_timeout: 800
    nightly: false
    vm_boot: true

  # TPM2 with swtpm, on the composefs + systemd-boot layout dakota-luks
  # already unlocks with a passphrase. Two boots (see the header). Needs the
  # image's initrd to unlock with a TPM2 token; if it cannot, the second
  # boot waits at the prompt and times out.
  - name: dakota-tpm2
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    encryption: tpm2-luks-passphrase
    luks_passphrase: "bootcrew-luks-test"
    vm_timeout: 800
    nightly: false
    vm_boot: true
    required: true # #423: gating, on each PR and the nightly VM run

  # btrfsSubvolumes: the root in an @ subvolume, mounted with
  # rootflags=subvol=@,compress=zstd:1. The guest must mount @ as the recipe
  # says and have no other top-level subvolume
  # (scripts/vm-checks/btrfs-subvolumes.sh). dakota's kernel has btrfs
  # (dakota-luks-btrfs boots), and GPT auto-discovery finds the root, so
  # only rootflags select the subvolume. Unencrypted, so a failure here is
  # the subvolume, not LUKS.
  - name: dakota-btrfs-subvolumes
    image: ghcr.io/projectbluefin/dakota@sha256:06f5511bca3ce5b44cb9069c2f34d77823b300ae7aada9e177075e986103b28e # latest
    ssh_image_name: dakota
    filesystem: btrfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    btrfs_subvolumes: true
    nightly: false
    vm_boot: true

  # gentoo-bootc disabled: consistently fails with missing blob in containers-storage
  # (sha256:2443e8...) — likely a broken layer in the ghcr.io/bootcrew/gentoo-bootc image.
  # Re-enable once upstream fixes the image.
  # - name: gentoo-bootc
  #   image: ghcr.io/bootcrew/gentoo-bootc:latest
  #   filesystem: xfs
  #   composefs_backend: true
  #   unified_storage: false
  #   selinux_disabled: false

  # ghcr.io/bootcrew/debian-bootc is a composefs-native image and ships no
  # `ostree` binary: with composefs_backend=false the ostree install path
  # fails with "Creating ostree deployment: No such file or directory".
  # composefs requires fs-verity, which XFS does not support, so use ext4
  # (the same backend/layout as the passing dakota canary).
  - name: debian-bootc
    image: ghcr.io/bootcrew/debian-bootc@sha256:006eaaad4072b4925ef6f2bb693332a81baee1ff01fec4b1a68bdcc7b0eb622b # latest
    filesystem: ext4
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false  # SSH-enabled image boots but never answers SSH in the VM (login prompt only); keep nightly-only until ssh.service is fixed
    build_ssh_image: true

  # frostyard/snow is a sealed composefs image: it ships a UKI
  # (boot/EFI/Linux/7.2.9+deb14-amd64.efi) whose embedded command line is
  # only `rw composefs=?<digest>` — no root=. Such an image finds its root by
  # GPT auto-discovery, which only fisherman's systemd-boot layout provides
  # (root partition carries the DPS root type, see PartitionSystemdBoot and
  # #219). Without `bootloader: systemd` it was installed on the grub2
  # 3-partition layout with a generic root type.
  - name: frostyard-snow
    image: ghcr.io/frostyard/snow@sha256:7c1a655c3754f758bb39ad32ed0de3fa1ff70db346dc9e9e78bc4cc9beef6eee # latest
    filesystem: btrfs
    composefs_backend: true
    bootloader: systemd
    unified_storage: false
    selinux_disabled: false
    flatpaks: []
    vm_boot: false

  # frostyard-snowloaded disabled: image bundles an older libostree built without
  # composefs support, but the Ubuntu 24.04 runner has the composefs kernel module
  # loaded. libostree sees composefs available at runtime and tries to use it, then
  # fails with "composefs: enabled at runtime, but support is not compiled in".
  # Re-enable once the image ships a libostree with composefs compiled in.
  # - name: frostyard-snowloaded
  #   image: ghcr.io/frostyard/snowloaded:latest
  #   filesystem: xfs
  #   composefs_backend: false
  #   unified_storage: false
  #   selinux_disabled: false

# bootc store reuse (#384 phase 2): the disposable offline VM profile. A VM
# booted from the installed ssh_image_name, with no registry reachable,
# installs itself onto a second disk from its own bootc store
# (recipe sourceReuse), then that disk boots and must be the verified copy.
# Run by bootcrew-vm.yml's store-reuse-advisory job, which is ADVISORY
# (continue-on-error, not a required canary) and never part of the image
# lists above. ostree + GRUB only: the reuse refuses composefs.
# scripts/store-reuse-vm.sh, docs/SOURCE-REUSE.md.
store_reuse:
  - name: centos-bootc-store-reuse
    ssh_image_name: centos-bootc
    filesystem: xfs
    composefs_backend: false
    vm_memory: 4G
    vm_timeout: 3000
