name: Build SSH-enabled Images

on:
  push:
    branches: [dev, prod]
    paths:
      - 'scripts/Containerfile.ssh-enable'
      - '.github/workflows/build-ssh-images.yml'
      - 'tests/bootcrew-matrix.yaml'
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday rebuild to pick up upstream base image updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse SSH image matrix from bootcrew-matrix.yaml
        id: read-matrix
        run: |
          python3 << 'EOF'
          import json
          import yaml

          with open('tests/bootcrew-matrix.yaml') as f:
              data = yaml.safe_load(f)

          images = [
              {'name': img['name'], 'base_image': img['image']}
              for img in data['images']
              if img.get('build_ssh_image') == True
          ]
          print("Building SSH images for:", [i['name'] for i in images])
          with open('/tmp/matrix.json', 'w') as f:
              f.write('matrix=' + json.dumps(images) + '\n')
          EOF
          cat /tmp/matrix.json >> "$GITHUB_OUTPUT"

  build:
    name: build / ${{ matrix.image.name }}
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SSH-enabled image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scripts/Containerfile.ssh-enable
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.image.base_image }}
          tags: |
            ${{ env.REGISTRY }}/tuna-os/fisherman/${{ matrix.image.name }}:ssh-enabled
            ${{ env.REGISTRY }}/tuna-os/fisherman/${{ matrix.image.name }}:ssh-enabled-${{ github.sha }}

      - name: Image built and pushed
        run: |
          echo "✅ Built: ${{ env.REGISTRY }}/tuna-os/fisherman/${{ matrix.image.name }}:ssh-enabled"
          echo "   Base: ${{ matrix.image.base_image }}"
