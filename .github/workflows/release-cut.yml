name: Cut Release

# The manual path. promote.yml is the normal one -- it cuts a release on
# its own once dev is green and has soaked. Use this to force a release
# outside that flow, or to pin an exact version.
#
# Run it on `dev`. It will:
#   1. Compute the next semver from the last git tag
#   2. Create and push the tag (this triggers release-publish.yml)
#   3. Open a PR from dev → prod with a generated changelog

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = derive from conventional commits)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: Explicit version override (e.g. 1.2.3) — leave blank to use bump
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  cut:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_push_triggers_publish: ${{ steps.token.outputs.is_pat }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a PAT so the tag push can trigger release-publish.yml
          # (GITHUB_TOKEN-created tags/commits don't re-trigger workflows)
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Whether the checkout above got a PAT or fell back to GITHUB_TOKEN.
      # GitHub does not start workflow runs from GITHUB_TOKEN-authored
      # events, so with the fallback the tag push below cannot trigger
      # release-publish.yml — the publish job at the end calls it instead.
      # With a real PAT the push does trigger it, and calling it as well
      # would publish the same tag twice, so that job is skipped.
      - name: Detect push credential
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "is_pat=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_TOKEN is set — the tag push will trigger release-publish.yml"
          else
            echo "is_pat=false" >> "$GITHUB_OUTPUT"
            echo "No RELEASE_TOKEN — this workflow will call release-publish.yml directly"
          fi

      - name: Compute next version
        id: version
        run: |
          LAST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.' | head -1)
          LAST=${LAST:-v0.0.0}
          echo "Last tag: $LAST"

          if [ -n "${{ inputs.version }}" ]; then
            NEXT="v${{ inputs.version }}"
          elif [ "${{ inputs.bump }}" = "auto" ]; then
            # Same derivation promote.yml uses, so a hand-cut release and an
            # automatic one cannot disagree about what the next version is.
            NEXT=$(./scripts/next-version.sh)
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            case "${{ inputs.bump }}" in
              major) NEXT="v$((MAJOR+1)).0.0" ;;
              minor) NEXT="v${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEXT="v${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          fi

          echo "Next version: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST"    >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          LAST="${{ steps.version.outputs.last }}"
          NEXT="${{ steps.version.outputs.version }}"

          if [ "$LAST" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" \
            --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" \
            --no-merges)

          # Write to a temp file to avoid quoting issues.
          #
          # The merge-method warning is first because it is the one thing a
          # reviewer has to get right and cannot undo: squashing this PR is
          # what left prod permanently diverged from dev after #220, so every
          # later promotion conflicted in files touched on both sides.
          {
            echo "> [!IMPORTANT]"
            echo "> **Merge this with a merge commit. Do not squash and do not rebase.**"
            echo ">"
            echo "> A squash replaces dev's commits with one new commit that shares"
            echo "> no ancestry with them. prod then looks diverged from dev forever,"
            echo "> even though the content is identical, and every future promotion"
            echo "> conflicts. That is what #220 did, and untangling it needed a"
            echo "> hand-resolved merge across 18 files."
            echo ">"
            echo "> A merge commit keeps dev's tip as an ancestor of prod, so the"
            echo "> next promotion is an ordinary fast-forward."
            echo ""
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${LAST}...${NEXT}"
          } > /tmp/changelog.md

          echo "Generated changelog:"
          cat /tmp/changelog.md

      - name: Create and push tag
        run: |
          NEXT="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"
          echo "✅ Pushed tag $NEXT"

      - name: Open release PR dev → prod
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NEXT="${{ steps.version.outputs.version }}"
          BODY=$(cat /tmp/changelog.md)

          gh pr create \
            --base prod \
            --head dev \
            --title "Release $NEXT" \
            --body "$BODY" \
            --label "release" || echo "PR may already exist or dev is already up to date with prod"

  # The tag push above cannot start release-publish.yml when it was made
  # with GITHUB_TOKEN, so call it. Skipped when a PAT did the push, since
  # then the push event already started it and this would be a second run
  # against a tag that already has a release.
  publish:
    needs: cut
    if: needs.cut.outputs.tag_push_triggers_publish != 'true'
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.cut.outputs.version }}
    permissions:
      contents: write
      packages: read
