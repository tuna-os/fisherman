name: Workflow lint

on:
  pull_request:
    paths: [".github/workflows/**"]
  # No path filter on push: promote.yml requires an `actionlint` check on the
  # exact dev commit it promotes. Filtered to workflow changes, the check never
  # existed on ordinary code commits and the gate refused them forever (#395
  # sat unreleased behind v0.5.2). The run takes seconds.
  push:
    branches: [main, dev, prod]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate GitHub Actions workflows
        # Existing repositories own their shellcheck policy separately. This
        # keeps actionlint focused on workflow syntax and expressions.
        # actionlint v1.7.12 (:latest resolved to this digest on 2026-10-31).
        # Pinned by digest so an upstream tag move cannot change CI (tunaOS#3229).
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -ignore shellcheck
