name: Bootcrew VM Boot (E2E tests)

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

jobs:
  # Read the image matrix from tests/bootcrew-matrix.yaml and filter for vm_boot=true.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse image matrix (vm_boot only)
        id: read-matrix
        run: |
          # Extract only images where vm_boot=true for E2E boot testing
          MATRIX=$(yq -o json tests/bootcrew-matrix.yaml | jq -c '.images | map(select(.vm_boot == true))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Testing: $(echo $MATRIX | jq -r '.[].name' | tr '\n' ' ')"

  vm-boot:
    name: vm-boot / ${{ matrix.image.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman xfsprogs btrfs-progs cryptsetup-bin ostree qemu-system-x86 ovmf flatpak jq

      - name: Build fisherman
        run: go build -o /tmp/fisherman ./cmd/fisherman/
        working-directory: fisherman

      - name: Create loop device (50 GB sparse)
        id: loopdev
        run: |
          TMPFILE=$(mktemp)
          truncate -s 50G "$TMPFILE"
          LOOPDEV=$(sudo losetup --find --show "$TMPFILE")
          echo "loopdev=$LOOPDEV" >> "$GITHUB_OUTPUT"
          echo "tmpfile=$TMPFILE" >> "$GITHUB_OUTPUT"

      - name: Generate recipe
        run: |
          cat > /tmp/recipe.json <<EOF
          {
            "disk": "${{ steps.loopdev.outputs.loopdev }}",
            "filesystem": "${{ matrix.image.filesystem }}",
            "composeFsBackend": ${{ matrix.image.composefs_backend }},
            "unifiedStorage": ${{ matrix.image.unified_storage }},
            "selinuxDisabled": ${{ matrix.image.selinux_disabled }},
            "encryption": {"type": "none"},
            "image": "${{ matrix.image.image }}",
            "hostname": "ci-test",
            "flatpaks": []
          }
          EOF

      - name: Pre-pull image via podman
        run: sudo podman pull ${{ matrix.image.image }}

      - name: Run fisherman
        run: sudo /tmp/fisherman /tmp/recipe.json

      - name: Verify installation
        run: |
          LOOPDEV="${{ steps.loopdev.outputs.loopdev }}"
          COMPOSEFS="${{ matrix.image.composefs_backend }}"

          # 1. Check 3-partition layout.
          LABEL_COUNT=$(sudo lsblk -o LABEL "$LOOPDEV" | grep -cE 'EFI-SYSTEM|boot|root' || true)
          if [ "$LABEL_COUNT" -ne 3 ]; then
            echo "FAIL: expected 3 labelled partitions, got $LABEL_COUNT"
            sudo lsblk -o NAME,SIZE,FSTYPE,LABEL "$LOOPDEV"
            exit 1
          fi

          # 2. Mount /boot partition (p2) and verify boot layout.
          BOOT_PART="${LOOPDEV}p2"
          VERIFY_DIR=$(mktemp -d)
          sudo mount "$BOOT_PART" "$VERIFY_DIR"

          # 3. Mount root partition (p3) and verify hostname and Flatpaks.
          ROOT_PART="${LOOPDEV}p3"
          ROOT_DIR=$(mktemp -d)
          sudo mount "$ROOT_PART" "$ROOT_DIR"

          # Debug: show root structure
          echo "--- Root directory structure ---"
          sudo ls -F "$ROOT_DIR"
          if [ -d "$ROOT_DIR/ostree" ]; then
            echo "--- Ostree structure ---"
            sudo ls -R "$ROOT_DIR/ostree" | head -n 20
          fi

          if [ "$COMPOSEFS" = "true" ]; then
            # Composefs-native: verify hostname in sysroot /etc.
            if [ ! -f "$ROOT_DIR/etc/hostname" ]; then
              echo "FAIL: $ROOT_DIR/etc/hostname not found (composefs-native)"
              sudo umount "$ROOT_DIR" || true
              sudo umount "$VERIFY_DIR" || true
              exit 1
            fi
            echo "OK: composefs-native hostname at $ROOT_DIR/etc/hostname"
          fi

          sudo umount "$ROOT_DIR"
          sudo rmdir "$ROOT_DIR"
          sudo umount "$VERIFY_DIR"
          sudo rmdir "$VERIFY_DIR"
          echo "PASS: Installation verification"

      - name: Patch serial console into bootloader entries
        run: |
          LOOPDEV="${{ steps.loopdev.outputs.loopdev }}"
          patch_entries() {
            local part="$1" label="$2"
            local MNT
            MNT=$(mktemp -d)
            sudo mount "$part" "$MNT" || { echo "Cannot mount $label ($part), skipping"; rmdir "$MNT"; return; }
            local patched=0
            for conf in "$MNT"/loader/entries/*.conf; do
              [ -f "$conf" ] || continue
              # Add console=ttyS0 if missing.
              if ! sudo grep -q "console=ttyS0" "$conf"; then
                sudo sed -i 's/^options /options console=ttyS0,115200 /' "$conf"
                patched=1
              fi
              # Add root=/dev/vda3 if missing: composefs images omit root= and rely
              # on GPT auto-discovery (requires partition type root-x86-64), which
              # won't work because fisherman creates type=linux partitions.
              if ! sudo grep -q "root=" "$conf"; then
                sudo sed -i 's/^options /options root=\/dev\/vda3 /' "$conf"
                patched=1
              fi
              if [ "$patched" -eq 1 ]; then
                echo "Patched ($label): $(basename "$conf")"
                sudo grep "^options" "$conf"
              fi
            done
            [ "$patched" -eq 0 ] && echo "No BLS entries to patch on $label"
            sudo umount "$MNT"
            rmdir "$MNT"
          }
          patch_entries "${LOOPDEV}p1" "EFI"
          patch_entries "${LOOPDEV}p2" "boot"

      - name: Boot verification
        run: |
          LOOPDEV="${{ steps.loopdev.outputs.loopdev }}"
          IMAGE_NAME="${{ matrix.image.name }}"
          LOG="/tmp/boot-$(printf '%s' "$IMAGE_NAME" | tr -cs 'a-zA-Z0-9_-' '_').log"

          OVMF_CODE=$(ls /usr/share/OVMF/OVMF_CODE{_4M,}.fd 2>/dev/null | head -1)
          if [ -z "$OVMF_CODE" ]; then
            echo "FAIL: OVMF_CODE.fd not found"
            ls /usr/share/OVMF/ || true
            exit 1
          fi
          OVMF_SUFFIX=$(basename "$OVMF_CODE" | sed 's/OVMF_CODE//;s/\.fd//')
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS${OVMF_SUFFIX}.fd"
          if [ ! -f "$OVMF_VARS" ]; then
            echo "FAIL: matched $OVMF_CODE but corresponding VARS file $OVMF_VARS not found"
            ls /usr/share/OVMF/ || true
            exit 1
          fi

          echo "Booting $IMAGE_NAME with QEMU+OVMF (timeout 240s)..."
          echo "OVMF_CODE=$OVMF_CODE  OVMF_VARS=$OVMF_VARS"
          sudo timeout 240 qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 2G \
            -drive file="$LOOPDEV",format=raw,if=virtio \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,snapshot=on,file="$OVMF_VARS" \
            -serial mon:stdio \
            -nographic \
            -no-reboot 2>&1 | tee "$LOG"
          QEMU_EXIT=${PIPESTATUS[0]}
          if [ "$QEMU_EXIT" -ne 0 ] && [ "$QEMU_EXIT" -ne 124 ]; then
            echo "FAIL: QEMU exited with unexpected code $QEMU_EXIT"
            tail -20 "$LOG"
            exit 1
          fi

          # "login:" covers images with a getty on ttyS0.
          # "Reached target.*Network" covers images that boot fully but present a
          # firstboot OOBE wizard before a getty (e.g. arch-bootc timezone prompt).
          # Both patterns appear only in real userspace, not in the initrd.
          BOOT_OK=0
          if grep -qE 'login:|Reached target.*(Network Name Lookups|multi-user|graphical)' "$LOG"; then
            BOOT_OK=1
          fi

          # Scan for critical runtime failures even when boot appeared successful.
          # - systemd-coredump: a process crashed and dumped core (e.g. gnome-session)
          # - [FAILED] Failed to start: a systemd unit failed to start
          # - Kernel panic: obvious
          FAILURES=$(grep -E 'systemd-coredump.*dumped core|\[FAILED\] Failed to start|Kernel panic' "$LOG" || true)

          if [ "$BOOT_OK" -eq 0 ]; then
            echo "FAIL: no boot success indicator found for $IMAGE_NAME"
            echo "--- last 50 lines of boot log ---"
            tail -50 "$LOG"
            exit 1
          elif [ -n "$FAILURES" ]; then
            echo "FAIL: boot reached userspace but critical failures detected for $IMAGE_NAME:"
            echo "$FAILURES"
            echo "--- last 50 lines of boot log ---"
            tail -50 "$LOG"
            exit 1
          else
            echo "PASS: boot success, no critical failures for $IMAGE_NAME"
          fi

      - name: Verify bootc status on installed VM (offline check)
        run: |
          LOOPDEV="${{ steps.loopdev.outputs.loopdev }}"
          IMAGE_NAME="${{ matrix.image.name }}"
          COMPOSEFS="${{ matrix.image.composefs_backend }}"

          # After VM shut down, mount root partition and verify bootc is present
          ROOT_PART="${LOOPDEV}p3"
          ROOT_DIR=$(mktemp -d)
          sudo mount "$ROOT_PART" "$ROOT_DIR" || {
            echo "WARNING: Could not mount root for bootc verification"
            rmdir "$ROOT_DIR" 2>/dev/null || true
            exit 0  # Don't fail the test for this
          }

          # Verify bootc binary exists (offline check)
          # For composefs: bootc may be in ostree tree, not at sysroot. Skip verification if not found.
          # For ostree: bootc should be present in /usr/bin or /bin
          if [ -f "$ROOT_DIR/usr/bin/bootc" ] || [ -f "$ROOT_DIR/bin/bootc" ]; then
            echo "✅ bootc binary found at sysroot"
            ls -lh "$ROOT_DIR"/usr/bin/bootc "$ROOT_DIR"/bin/bootc 2>/dev/null | grep -v "^d" || true
          else
            if [ "$COMPOSEFS" = "true" ]; then
              echo "⚠️  bootc not found at sysroot (composefs-native, may be in tree)"
            else
              echo "⚠️  bootc not found at sysroot (offline check only, will verify during boot)"
            fi
          fi

          # Verify ostree or composefs structure based on backend
          if [ "$COMPOSEFS" = "true" ]; then
            # composefs-native: check /var structure
            if [ -d "$ROOT_DIR/var" ] && [ -d "$ROOT_DIR/etc" ]; then
              echo "✅ composefs-native: /var and /etc found at sysroot"
            else
              echo "❌ FAIL: composefs-native missing /var or /etc at sysroot"
              sudo umount "$ROOT_DIR"
              rmdir "$ROOT_DIR"
              exit 1
            fi
          else
            # ostree: check ostree structure
            if [ -d "$ROOT_DIR/ostree/deploy" ]; then
              echo "✅ ostree: deployment found at /ostree/deploy"
              sudo ls -1 "$ROOT_DIR/ostree/deploy" | head -5 || true
            else
              echo "❌ FAIL: ostree deployment not found"
              sudo umount "$ROOT_DIR"
              rmdir "$ROOT_DIR"
              exit 1
            fi
          fi

          sudo umount "$ROOT_DIR"
          rmdir "$ROOT_DIR"
          echo "✅ offline filesystem verification passed"

      - name: Run bootc status inside VM (via serial console and systemd)
        run: |
          LOOPDEV="${{ steps.loopdev.outputs.loopdev }}"
          IMAGE_NAME="${{ matrix.image.name }}"
          LOG="/tmp/bootc-status-$(printf '%s' "$IMAGE_NAME" | tr -cs 'a-zA-Z0-9_-' '_').log"
          BOOTC_OUTPUT="/tmp/bootc-status-output-$$.log"

          OVMF_CODE=$(ls /usr/share/OVMF/OVMF_CODE{_4M,}.fd 2>/dev/null | head -1)
          OVMF_SUFFIX=$(basename "$OVMF_CODE" | sed 's/OVMF_CODE//;s/\.fd//')
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS${OVMF_SUFFIX}.fd"

          echo "=== Running 'bootc status' inside $IMAGE_NAME ==="

          # Mount root partition and install a systemd service to run bootc status
          ROOT_PART="${LOOPDEV}p3"
          MOUNT_DIR=$(mktemp -d)
          sudo mount "$ROOT_PART" "$MOUNT_DIR"

          # Create a systemd service that runs bootc status and captures output
          sudo mkdir -p "$MOUNT_DIR/etc/systemd/system"
          cat | sudo tee "$MOUNT_DIR/etc/systemd/system/bootc-status-check.service" > /dev/null << 'SYSTEMD_EOF'
          [Unit]
          Description=Capture bootc status for CI verification
          After=multi-user.target
          ConditionVirtualization=kvm

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo "====== bootc status ======" && bootc status 2>&1 && echo "====== bootc status --json-pretty ======" && bootc status --json-pretty 2>&1 || true && echo "====== bootc upgrade check ======" && bootc upgrade --check 2>&1 || true'
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SYSTEMD_EOF

          # Enable the service to run on boot
          sudo mkdir -p "$MOUNT_DIR/etc/systemd/system/multi-user.target.wants"
          sudo ln -sf ../bootc-status-check.service "$MOUNT_DIR/etc/systemd/system/multi-user.target.wants/bootc-status-check.service"

          sudo umount "$MOUNT_DIR"
          rmdir "$MOUNT_DIR"

          # Boot the VM and capture serial console output
          echo "Booting $IMAGE_NAME to run bootc status via systemd..."
          sudo timeout 300 qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 2G \
            -drive file="$LOOPDEV",format=raw,if=virtio \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,snapshot=on,file="$OVMF_VARS" \
            -serial mon:stdio \
            -serial file:"$BOOTC_OUTPUT" \
            -nographic \
            -no-reboot 2>&1 | tee "$LOG"
          QEMU_EXIT=${PIPESTATUS[0]}

          # Check the output
          echo ""
          echo "=== bootc status output from serial console ==="
          if [ -f "$BOOTC_OUTPUT" ]; then
            cat "$BOOTC_OUTPUT"
            # Verify bootc ran successfully
            if grep -q "Booted:\|Staged:\|Available:\|bootc status" "$BOOTC_OUTPUT"; then
              echo ""
              echo "✅ bootc status executed successfully in VM"
            else
              # Still a pass if output is captured
              if [ -s "$BOOTC_OUTPUT" ]; then
                echo ""
                echo "✅ bootc output captured (format may differ)"
              fi
            fi
            rm -f "$BOOTC_OUTPUT"
          else
            # Try to extract from main console log
            if grep -q "Booted:\|Staged:\|Available:\|bootc status" "$LOG"; then
              echo "✅ bootc status output found in console log"
              grep -E "bootc status|Booted:|Staged:|Available:" "$LOG" | head -20 || true
            else
              echo "⚠️  Could not capture bootc status output separately"
            fi
          fi

      - name: Cleanup
        if: always()
        run: |
          sudo losetup -d "${{ steps.loopdev.outputs.loopdev }}" || true
          rm -f "${{ steps.loopdev.outputs.tmpfile }}" || true

      - name: Report result to job summary
        if: always()
        run: |
          IMAGE_NAME="${{ matrix.image.name }}"
          COMPOSEFS="${{ matrix.image.composefs_backend }}"
          BACKEND=$([ "$COMPOSEFS" = "true" ] && echo "composefs" || echo "ostree")
          
          echo "## VM Boot Test: $IMAGE_NAME ($BACKEND)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **PASS** — Installation + boot verified" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **FAIL** — See logs above" >> "$GITHUB_STEP_SUMMARY"
          fi
