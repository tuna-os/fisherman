name: Bootcrew VM Boot (E2E tests)

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse image matrix (vm_boot only)
        id: read-matrix
        run: |
          sudo apt-get update -qq && sudo apt-get install -y yq jq
          MATRIX=$(cat tests/bootcrew-matrix.yaml | yq eval -o=json '.' | jq -c '.images | map(select(.vm_boot == true))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix output:"
          echo "$MATRIX" | jq '.'
          echo "Testing: $(echo $MATRIX | jq -r '.[].name' | tr '\n' ' ')"

  vm-boot:
    name: vm-boot / ${{ matrix.image.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          just --version

      - name: Setup CI environment
        run: just ci-install-tools

      - name: Generate SSH keys
        run: just setup-ssh-keys

      - name: Build fisherman
        run: just build

      - name: Run bootcrew test
        run: |
          IMAGE_JSON='${{ toJson(matrix.image) }}'
          just bootcrew-ci-test "$IMAGE_JSON"
