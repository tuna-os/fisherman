name: Bootcrew VM Boot (E2E tests)

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse image matrix (vm_boot only)
        id: read-matrix
        run: |
          python3 << 'EOF'
          import json
          import yaml
          
          with open('tests/bootcrew-matrix.yaml') as f:
              data = yaml.safe_load(f)
          
          images = [img for img in data['images'] if img.get('vm_boot') == True]
          matrix = json.dumps(images)
          
          with open('/tmp/matrix.json', 'w') as f:
              f.write(f'matrix={matrix}\n')
          
          print("Matrix output:")
          print(json.dumps(images, indent=2))
          print("Testing:", ' '.join(img['name'] for img in images))
          EOF
          
          cat /tmp/matrix.json >> "$GITHUB_OUTPUT"

  vm-boot:
    name: vm-boot / ${{ matrix.image.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Setup CI environment
        run: |
          # Install just via apt (required for subsequent just commands)
          sudo apt-get update -qq
          sudo apt-get install -y just
          # Now run the full CI setup
          just ci-install-tools

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Generate SSH keys
        run: just setup-ssh-keys

      - name: Build fisherman
        run: just build

      - name: Run unit tests
        run: sudo go test ./...
        working-directory: fisherman

      - name: Run bootcrew test
        run: |
          IMAGE_JSON='${{ toJson(matrix.image) }}'
          just bootcrew-ci-test "$IMAGE_JSON"
