name: Promote dev → prod

# The automatic release gate. `dev` is where work lands; `prod` is what
# shipped. This moves `prod` forward to a `dev` commit once every check on
# that commit is green and it has soaked, then tags it and publishes.
#
# Ported from tuna-os/bootc-installer's promote.yml, which has been running
# this shape for a while; the guards below are its guards, and the reasons
# they exist are its reasons.
#
# How it fires: whenever a gated workflow completes on dev (workflow_run),
# hourly as a catch-up, and by hand. Only the LAST gated workflow to finish
# on a commit sees "everything is complete", so earlier firings answer
# "wait" and exit green -- that is normal, not a failure.
#
# What it judges (scripts/promote-gate.py, #272): the push runs of the
# workflows in GATED_WORKFLOWS on the candidate, job by job. Not the
# commit's check runs: scheduled runs (nightly, SSH image rebuilds) attach
# their results to whatever commit was dev HEAD when the cron fired,
# advisory jobs report `failure` on their check run by design, and two
# workflows share the job name `unit-tests`. Every gated workflow runs on
# every push to dev with no path filter, so a gated run that is absent
# means the workflow did not start, and that is a refusal.
#
# What it refuses to do -- each refusal FAILS the Gate job, so a refused
# candidate shows red instead of a green run that did nothing:
#   - move prod to a commit that is not a descendant of prod (never rewinds,
#     never forks). While prod is diverged this refuses every time, and
#     promote-reconcile.yml is the one-shot that fixes that;
#   - promote while a gated workflow has no push run on the candidate, a
#     non-advisory job is red, or a REQUIRED_JOBS entry is not `success`;
#   - wait forever: a non-advisory job still running STALL_HOURS after its
#     run started is a refusal too;
#   - promote a commit younger than SOAK_MINUTES, so a fix-up push has time
#     to land before the previous commit ships. fisherman partitions disks;
#     the soak is cheap insurance;
#   - rely on a push to prod triggering anything. GITHUB_TOKEN pushes never
#     start workflows, so release-publish.yml is called, not awaited.
#
# Green outcomes that promote nothing: prod is already at the candidate, a
# newer dev commit superseded it during the soak, or a gated job is still
# running. tests/test-promote-gate.py holds the decision table and checks
# the names below against the workflow files.
#
# `force: true` skips the soak and the check gate. It exists for the day the
# gate is wrong. It is not the normal path.

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] uses no workflow_run payload; it gates this repository's own dev head on its workflow runs
    # Must equal GATED_WORKFLOWS below (tests/test-promote-gate.py).
    workflows:
      - Bootcrew VM Boot (E2E tests)
      - Workflow lint
      - customMounts E2E (manual layout)
    types: [completed]
    branches: [dev]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Specific dev commit to promote (default: newest)"
        required: false
        type: string
      force:
        description: Skip the soak and the check gate
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: promote-fisherman
  cancel-in-progress: false

env:
  DEV_BRANCH: dev
  PROD_BRANCH: prod
  # The workflows whose push run on the candidate is judged. Each must run
  # on every push to dev with no path filter (a path-filtered workflow
  # leaves no run behind on most commits and would block them forever, as
  # actionlint did). Scheduled-only workflows (Bootcrew Nightly, Build
  # SSH-enabled Images) are not here and never gate a release. Inside a
  # gated run, jobs named `advisory / ...` (continue-on-error) are ignored;
  # every other job must finish green or skipped.
  GATED_WORKFLOWS: |
    Bootcrew VM Boot (E2E tests)
    Workflow lint
    customMounts E2E (manual layout)
  # `workflow | job` entries that must be present AND `success`, so that a
  # job skipped by its `if:` cannot pass as "nothing failed".
  # required-canaries is the aggregate the branch protection uses.
  REQUIRED_JOBS: |
    Bootcrew VM Boot (E2E tests) | required-canaries
    Bootcrew VM Boot (E2E tests) | lint
    Bootcrew VM Boot (E2E tests) | unit-tests
    Workflow lint | actionlint
    customMounts E2E (manual layout) | customMounts E2E disk layout
  STALL_HOURS: "6"
  SOAK_MINUTES: "30"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      promote: ${{ steps.decide.outputs.promote }}
      sha: ${{ steps.candidate.outputs.sha }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: dev
          fetch-depth: 0

      - name: Pick the candidate
        id: candidate
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$PROD_BRANCH" 2>/dev/null || true
          if [ -n "$INPUT_SHA" ]; then
            SHA=$(git rev-parse --verify "$INPUT_SHA^{commit}")
            git merge-base --is-ancestor "$SHA" "origin/$DEV_BRANCH" \
              || { echo "::error::$SHA is not on $DEV_BRANCH"; exit 1; }
          else
            SHA=$(git rev-parse "origin/$DEV_BRANCH")
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify -q "origin/$PROD_BRANCH" >/dev/null; then
            echo "prod=$(git rev-parse "origin/$PROD_BRANCH")" >> "$GITHUB_OUTPUT"
            echo "prod_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "prod=" >> "$GITHUB_OUTPUT"
            echo "prod_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          PROD: ${{ steps.candidate.outputs.prod }}
          PROD_EXISTS: ${{ steps.candidate.outputs.prod_exists }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          say() { echo "promote=$1" >> "$GITHUB_OUTPUT"; echo "reason=$2" >> "$GITHUB_OUTPUT"; echo "$2"; }

          if [ "$PROD_EXISTS" = "true" ]; then
            if [ "$PROD" = "$SHA" ]; then
              say false "prod is already at $SHA"; exit 0
            fi
            if ! git merge-base --is-ancestor "$PROD" "$SHA"; then
              echo "::error::prod ($PROD) is not an ancestor of $SHA."
              echo "::error::Refusing to rewind or fork prod. If prod is diverged"
              echo "::error::(a squashed promotion), run promote-reconcile.yml once."
              say false "prod is not an ancestor of the candidate"; exit 1
            fi
          fi

          if [ "$FORCE" = "true" ]; then
            echo "::warning::force=true: skipping soak and check gate"
            say true "forced"; exit 0
          fi

          # Judge the candidate BEFORE the soak. Most firings are not the one
          # that can promote: the gated workflows finish at different times
          # and only the last to finish sees everything complete, the others
          # answer "wait" (or "refused") and must not hold a runner for the
          # rest of the soak just to learn that. Sleeping first cost one
          # 30-minute runner per firing (3 per push to dev, plus the hourly
          # catch-up); a candidate that is not ready now exits at once.
          judge() {
            if ! python3 scripts/promote-gate.py > /tmp/gate.out; then
              cat /tmp/gate.out
              echo "::error::scripts/promote-gate.py failed; cannot judge $SHA"
              say false "refused: the gate script failed"; exit 1
            fi
            cat /tmp/gate.out
            verdict=$(tail -n 1 /tmp/gate.out | cut -f1)
            reason=$(tail -n 1 /tmp/gate.out | cut -f2-)
            case "$verdict" in
              promote) return 0 ;;
              wait)    say false "waiting: $reason"; exit 0 ;;
              *)
                echo "::error::refusing to promote $SHA: $reason"
                say false "refused: $reason"; exit 1 ;;
            esac
          }
          judge

          # Only a candidate that is green and complete sleeps out the rest
          # of the soak, and is judged again afterwards. Sleep rather than
          # exit and hope a later firing arrives: GitHub's cron ticks are
          # unreliable enough that the hourly catch-up cannot be counted on.
          age=$(( $(date -u +%s) - $(git show -s --format=%ct "$SHA") ))
          remaining=$(( SOAK_MINUTES * 60 - age ))
          if [ "$remaining" -gt 0 ]; then
            echo "candidate is $((age / 60)) min old; soak is ${SOAK_MINUTES} min; sleeping $((remaining / 60 + 1)) min"
            sleep "$remaining"
            git fetch -q origin "$DEV_BRANCH"
            NEWEST=$(git rev-parse "origin/$DEV_BRANCH")
            if [ -z "$INPUT_SHA" ] && [ "$NEWEST" != "$SHA" ]; then
              say false "superseded by $NEWEST while soaking"; exit 0
            fi
            judge
          fi
          say true "$reason, soak elapsed"

      - name: Summary
        if: always()
        env:
          REASON: ${{ steps.decide.outputs.reason }}
          SHA: ${{ steps.candidate.outputs.sha }}
          PROMOTE: ${{ steps.decide.outputs.promote }}
        run: |
          {
            echo "## Promote dev → prod"
            echo
            echo "- candidate: \`$SHA\`"
            echo "- decision: **${PROMOTE:-false}** — $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1  # zizmor: ignore[artipacked] later steps push prod and the release tag with these credentials
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: Compute the next version
        id: version
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch -q --tags origin
          NEXT=$(./scripts/next-version.sh "$SHA")
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "next version: $NEXT"

      # Fast-forward only; the gate already proved prod is an ancestor.
      - name: Fast-forward prod
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git push origin "$SHA:refs/heads/$PROD_BRANCH"
          echo "prod -> $SHA"

      - name: Tag the release
        env:
          NEXT: ${{ steps.version.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT" "$SHA"
          git push origin "$NEXT"
          {
            echo "- promoted \`$SHA\` to \`$PROD_BRANCH\`"
            echo "- tagged \`$NEXT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Called rather than awaited: the tag above was pushed with GITHUB_TOKEN,
  # and GitHub does not start workflow runs from GITHUB_TOKEN-authored
  # events. That is exactly how v0.3.0 got a tag and no release.
  publish:
    name: Publish
    needs: promote
    uses: $/.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.promote.outputs.version }}
    permissions:
      contents: write
      packages: read
